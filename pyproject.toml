[project]
name = "tender-desk"
version = "0.1.0"
description = "Add your description here"
authors = [
    { name = "Rod Fernandez", email = "hello@rodfernandezdesign.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162.7",
    "fastembed>=0.9.1",
    "httpx>=0.28.1",
    "langgraph>=1.2.21",
    "langgraph-checkpoint-postgres>=3.2.0",
    "mcp>=2.3.0",
    "pgvector>=0.5.1",
    "psycopg-pool>=3.3.3",
    "psycopg[binary,pool]>=3.3.9",
    "pydantic>=2.14.3",
    "pydantic-settings>=2.16.3",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
spend = "tender_desk.spend:main"
tender-mcp = "tender_desk.mcp_server:main"

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
    "ruff>=0.17.5",
]
