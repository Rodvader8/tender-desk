[project]
name = "tender-desk"
version = "0.1.0"
description = "Add your description here"
authors = [
    { name = "Rod Fernandez", email = "hello@rodfernandezdesign.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162.7",
    "fastembed>=0.9.1",
    "httpx>=0.28.1",
    "langgraph>=1.2.21",
    "langgraph-checkpoint-postgres>=3.2.0",
    "mcp>=2.3.0",
    "pgvector>=0.5.1",
    "prometheus-client>=0.26.0",
    "psycopg-pool>=3.3.3",
    "psycopg[binary,pool]>=3.3.9",
    "pydantic>=2.14.3",
    "pydantic-settings>=2.16.3",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
spend = "tender_desk.spend:main"
tender-mcp = "tender_desk.mcp_server:main"
tender-migrate = "tender_desk.migrate:main"

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pip-audit>=2.10.1",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
    "ruff>=0.17.5",
    "types-psycopg2>=2.9.21.20261030",
]

[tool.ruff]
line-length = 130
target-version = "py312"
extend-exclude = ["results"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["E501"]          # the formatter owns line length
[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105", "S106", "S608"]       # asserts, dummy credentials and f-string SQL in test cleanup are fine in tests
"scripts/*" = ["S101", "S311"]
"src/tender_desk/evals/*" = ["S101", "S311"]
"src/tender_desk/graph.py" = []

[tool.mypy]
python_version = "3.12"
strict = false
warn_unused_ignores = true
warn_redundant_casts = true
check_untyped_defs = true
ignore_missing_imports = true
files = ["src/tender_desk"]
